function pyr(t,a){return a&&a.length?`<div class="pyr-row"><div class="pyr-title">${t}</div><div>${a.map(esc).join(" · ")}</div></div>`:""}async function openDetail(code){const p=byCode.get(ck(code));if(!p)return;$("#detailOverlay").hidden=false;$("#detailBody").innerHTML="<p>Loading details…</p>";try{const x=(await ensureDetails())[ck(code)]||[[],[],[],[],"","","","", ""];$("#detailBody").innerHTML=`<div class="modal-grid"><div>${x[7]?`<img class="modal-image" src="${esc(x[7])}" alt="">`:""}</div><div><h2>${esc(p.name)}</h2><div class="brand">${esc(p.brand)}</div><div class="code">${esc(p.code)}</div>${x[4]?`<p>${esc(x[4])}</p>`:""}<div class="pyramid">${pyr("Top Notes",x[0])}${pyr("Heart Notes",x[1])}${pyr("Base Notes",x[2])}${(!x[0].length&&!x[1].length&&!x[2].length)?pyr("Notes",x[3]):""}</div><div class="modal-links">${x[5]?`<a href="${esc(x[5])}" target="_blank" rel="noopener">SHOP ON SHOBI</a>`:""}${x[6]?`<a href="${esc(x[6])}" target="_blank" rel="noopener">Fragrantica ↗</a>`:""}</div>${x[8]?`<p class="status">Identity source: ${esc(x[8])}</p>`:""}</div></div>`}catch(e){$("#detailBody").innerHTML="<p>Details unavailable.</p>"}}
async function openCompare(){if(compare.size<2)return;$("#compareOverlay").hidden=false;$("#compareBody").innerHTML="<p>Loading…</p>";const d=await ensureDetails();$("#compareBody").innerHTML=Array.from(compare).map(k=>{const p=byCode.get(k),x=d[k]||[[],[],[],[],"","","",""];return `<div><h3>${esc(p.name)}</h3><div class="brand">${esc(p.brand)}</div>${x[7]?`<img class="modal-image" src="${esc(x[7])}" alt="">`:""}${pyr("Top",x[0])}${pyr("Heart",x[1])}${pyr("Base",x[2])}</div>`}).join("")}
function toggle(s,k,max=Infinity){if(s.has(k))s.delete(k);else if(s.size<max)s.add(k)}
$("#grid").addEventListener("click",e=>{const c=e.target.closest(".card");if(!c)return;const k=c.dataset.code,a=e.target.closest("[data-action]")?.dataset.action;if(a==="link"||a==="frag-link")return;if(a==="fav"){toggle(favorites,k);saveSet("shobiFavoritesV2",favorites);render();counts()}else if(a==="owned"){toggle(owned,k);saveSet("shobiOwnedV2",owned);render();counts()}else if(a==="compare"){toggle(compare,k,3);render();counts()}else if(a==="brand"){selected.brand.add(byCode.get(k).brand);page=1;buildFilters();apply()}else if(a==="gender"){selected.gender.add(byCode.get(k).gender);page=1;buildFilters();apply()}else if(a==="season"||a==="note"){selected[a].add(e.target.closest("[data-value]").dataset.value);page=1;buildFilters();apply()}else if(a==="details"||!a)openDetail(k)});
$("#filters").addEventListener("change",e=>{const k=e.target.dataset.filter;if(!k)return;const v=e.target.value;e.target.checked?selected[k].add(v):selected[k].delete(v);page=1;apply()});$("#pagination").addEventListener("click",e=>{const p=Number(e.target.dataset.page);if(p){page=p;render();window.scrollTo({top:0,behavior:"smooth"})}});$("#search").addEventListener("input",e=>{query=e.target.value;page=1;apply()});$("#sort").addEventListener("change",e=>{sortMode=e.target.value;page=1;apply()});$("#pageSize").addEventListener("change",e=>{pageSize=Number(e.target.value)||48;page=1;render()});
$("#clearFilters").addEventListener("click",()=>{query="";$("#search").value="";Object.values(selected).forEach(s=>s.clear());collectionOnly=favoritesOnly=false;page=1;buildFilters();apply()});$("#favoriteToggle").addEventListener("click",()=>{favoritesOnly=!favoritesOnly;collectionOnly=false;page=1;apply()});$("#collectionToggle").addEventListener("click",()=>{collectionOnly=!collectionOnly;favoritesOnly=false;page=1;apply()});$("#compareToggle").addEventListener("click",openCompare);function syncThemeSwitch(){const d=document.documentElement.dataset.theme==="dark";$("#themeToggle")?.classList.toggle("is-dark",d);$("#themeToggle")?.classList.toggle("is-light",!d)}$("#themeToggle").addEventListener("click",()=>{const d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"light":"dark";localStorage.setItem("shobiThemeV2",d?"light":"dark");syncThemeSwitch()});$("#mobileFilter").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));$("#mobileFilterClose")?.addEventListener("click",()=>$("#sidebar").classList.remove("open"));$$("[data-close]").forEach(b=>b.addEventListener("click",()=>$("#"+b.dataset.close+"Overlay").hidden=true));$$(".overlay").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.hidden=true}));document.documentElement.dataset.theme=localStorage.getItem("shobiThemeV2")||"dark";syncThemeSwitch();
async function boot(){const ps=$("#pageSize");if(ps)ps.value=String(pageSize);skeleton();const t=performance.now();try{const r=await fetch("./site-runtime-v2.json?v=6c3406544b1e1a71",{cache:"no-store"});if(!r.ok)throw Error(r.status);const d=await r.json();perfumes=(d.p||[]).map((x,i)=>({id:i,code:x[0],name:x[1],brand:x[2],gender:x[3],status:x[4],isNew:!!x[5],rank:x[6]||0}));perfumes.forEach(p=>byCode.set(ck(p.code),p));filtered=perfumes.slice();setLoadStatus(`${perfumes.length.toLocaleString()} perfumes loaded in ${Math.round(performance.now()-t)} ms`);apply();requestAnimationFrame(()=>{buildFilters();const idle=window.requestIdleCallback||((fn)=>setTimeout(fn,500));idle(loadEnrichment,{timeout:1500})})}catch(e){setLoadStatus("Catalogue unavailable");$("#grid").innerHTML='<div class="empty">Unable to load catalogue.</div>';console.error(e)}}
/* UI_PARITY_V2_1 */
let newOnly=false,bestLimit=0;
const __baseHasFilters=hasFilters,__baseMatches=matches,__baseBuildFilters=buildFilters,__baseOpenDetail=openDetail;
hasFilters=function(){return __baseHasFilters()||newOnly||bestLimit>0};
matches=function(p){if(newOnly&&!p.isNew)return false;if(bestLimit>0&&(!p.rank||p.rank>bestLimit))return false;return __baseMatches(p)};

(function migrateLegacyState(){
  try{
    if(!localStorage.getItem('shobiFavoritesV2')){JSON.parse(localStorage.getItem('shobiFavorites')||'[]').forEach(v=>favorites.add(ck(v)));saveSet('shobiFavoritesV2',favorites)}
    if(!localStorage.getItem('shobiOwnedV2')){JSON.parse(localStorage.getItem('shobiOwned')||'[]').forEach(v=>owned.add(ck(v)));saveSet('shobiOwnedV2',owned)}
    if(!localStorage.getItem('shobiThemeV2')&&localStorage.getItem('shobiTheme'))localStorage.setItem('shobiThemeV2',localStorage.getItem('shobiTheme'));
  }catch(e){console.warn('legacy state migration skipped',e)}
})();

function renderRecent(){
  const el=$('#recentStrip'); if(!el)return;
  let codes=[];try{codes=JSON.parse(localStorage.getItem('shobiRecentV2')||'[]')}catch(e){}
  const items=codes.map(k=>byCode.get(ck(k))).filter(Boolean).slice(0,8);
  el.innerHTML='<span class="recent-label">Recently viewed</span>'+items.map(p=>`<button class="recent-pill" data-recent="${esc(ck(p.code))}">${esc(p.name)}</button>`).join('');
}
openDetail=async function(code){
  const k=ck(code);try{let a=JSON.parse(localStorage.getItem('shobiRecentV2')||'[]');a=[k,...a.filter(x=>ck(x)!==k)].slice(0,8);localStorage.setItem('shobiRecentV2',JSON.stringify(a))}catch(e){}
  renderRecent();return __baseOpenDetail(code);
};

function decorateFilterSearches(){
  $$('#filters .filter-group').forEach(g=>{
    const title=g.querySelector('.filter-title')?.textContent||'';
    if(!/^(Brand|Notes)$/i.test(title)||g.querySelector('.filter-mini-search'))return;
    const inp=document.createElement('input');inp.className='filter-mini-search';inp.placeholder='Search '+title.toLowerCase()+'...';
    const list=g.querySelector('.filter-list');g.insertBefore(inp,list);inp.addEventListener('input',()=>{const q=norm(inp.value);list.querySelectorAll('.filter-option').forEach(row=>row.hidden=q&&!norm(row.textContent).includes(q))});
  });
}
buildFilters=function(){__baseBuildFilters();decorateFilterSearches()};

function setBestLimit(n){bestLimit=bestLimit===n?0:n;$('#best50').classList.toggle('active',bestLimit===50);$('#best100').classList.toggle('active',bestLimit===100);page=1;apply()}
$('#newToggle').addEventListener('click',()=>{newOnly=!newOnly;$('#newToggle').classList.toggle('active',newOnly);page=1;apply()});
$('#best50').addEventListener('click',()=>setBestLimit(50));$('#best100').addEventListener('click',()=>setBestLimit(100));
$('#sidebarToggle').addEventListener('click',()=>{const l=document.querySelector('.layout');l.classList.toggle('sidebar-collapsed');localStorage.setItem('shobiSidebarCollapsedV2',l.classList.contains('sidebar-collapsed')?'1':'0')});
if(localStorage.getItem('shobiSidebarCollapsedV2')==='1')document.querySelector('.layout').classList.add('sidebar-collapsed');

function updateSuggestions(){
  const box=$('#searchSuggestions'),q=norm($('#search').value);if(q.length<2){box.hidden=true;box.innerHTML='';return}
  const a=perfumes.filter(p=>norm([p.name,p.brand,p.code].join(' ')).includes(q)).slice(0,7);if(!a.length){box.hidden=true;return}
  box.innerHTML=a.map(p=>`<button class="suggestion" data-suggest="${esc(ck(p.code))}"><strong>${esc(p.name)}</strong><small>${esc(p.brand)} · ${esc(p.code)}</small></button>`).join('');box.hidden=false;
}
$('#search').addEventListener('input',updateSuggestions);$('#searchSuggestions').addEventListener('click',e=>{const b=e.target.closest('[data-suggest]');if(!b)return;const p=byCode.get(b.dataset.suggest);if(!p)return;$('#search').value=p.name;query=p.name;page=1;$('#searchSuggestions').hidden=true;apply()});document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))$('#searchSuggestions').hidden=true});
$('#recentStrip').addEventListener('click',e=>{const b=e.target.closest('[data-recent]');if(b)openDetail(b.dataset.recent)});

const back=$('#smartBackTop');window.addEventListener('scroll',()=>back.classList.toggle('visible',window.scrollY>650),{passive:true});back.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
const __oldClear=$('#clearFilters').onclick;
$('#clearFilters').addEventListener('click',()=>{newOnly=false;bestLimit=0;$('#newToggle').classList.remove('active');$('#best50').classList.remove('active');$('#best100').classList.remove('active');page=1;apply()});
requestAnimationFrame(()=>{renderRecent();decorateFilterSearches();counts()});

boot();
</script></body></html>
