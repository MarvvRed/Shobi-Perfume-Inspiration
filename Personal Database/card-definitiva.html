<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Layout Preview V2</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>:root{--bg:#f4f1ea;--card:#fffdf8;--text:#1a1712;--accent:#b48a3a;--accent2:#9e762e;--border:rgba(180,138,58,.20);--borderStrong:rgba(180,138,58,.34);--input:#fffcf6}*{box-sizing:border-box}button{font:inherit}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font:14px/1.4 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);padding:20px}.card{width:352px;max-width:100%;display:flex;flex-direction:column;overflow:hidden;border-radius:18px;border:1px solid var(--border);background:var(--card);box-shadow:0 8px 20px rgba(89,68,32,.08)}.card-head{padding:15px 15px 8px}.perfume-name{font-size:17px;font-weight:800;line-height:1.2}.brand-filter{display:block;width:max-content;margin:7px 0 0;padding:0;border:0;background:transparent;color:var(--accent);font-size:14px;font-weight:700;cursor:pointer}.brand-filter:hover{text-decoration:underline;text-underline-offset:3px}.best{display:inline-flex;align-items:center;gap:7px;width:max-content;margin-top:9px;padding:4px 7px;border-radius:7px;background:#17130d;color:#f2d18f;font-size:9px;font-weight:900;line-height:1}.best-rank{opacity:.92}.card-image-wrap{height:155px;display:flex;align-items:center;justify-content:center;overflow:hidden}.card-image{display:block;width:100%;height:100%;max-width:96%;max-height:151px;object-fit:contain}.card-body{padding:12px 15px 14px;display:flex;flex-direction:column}.meta-row,.notes{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.filter-chip,.season-chip,.note-chip{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(180,138,58,.15);border-radius:999px;background:rgba(180,138,58,.08);color:var(--accent2);font-size:12px;font-weight:800;line-height:1;cursor:pointer}.filter-chip:hover,.season-chip:hover,.note-chip:hover{border-color:var(--borderStrong);background:rgba(180,138,58,.14);transform:translateY(-1px)}.gender-chip{gap:5px;padding:5px 7px}.gender-fa{font-size:14px;color:#2f6fea}.meta-divider{width:1px;height:20px;background:var(--borderStrong);margin:0 3px}.season-group{display:inline-flex;align-items:center;gap:5px}.season-chip{width:30px;height:28px;padding:0}.season-icon{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;font-size:18px;line-height:1}.notes-title{margin-top:10px;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.notes{margin-top:7px}.note-chip{gap:5px;padding:5px 7px 5px 5px}.note-icon{width:20px;height:20px;border-radius:50%;object-fit:cover;display:block;flex:0 0 20px}.card-actions{margin-top:auto;padding:12px 15px 15px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:7px}.action{height:32px;border-radius:9px;border:1px solid var(--border);background:var(--input);color:var(--text);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:800;cursor:pointer;transition:.15s ease}.action:hover{transform:translateY(-1px);border-color:var(--borderStrong);box-shadow:0 3px 8px rgba(89,68,32,.08)}.details{color:var(--accent2);border-color:var(--borderStrong)}.shop{background:var(--accent);color:#17130d;border-color:var(--accent);font-weight:900}.shop:hover{filter:brightness(.97)}.primary{display:grid;grid-template-columns:1fr 1fr;gap:7px}.favorite.active{background:#fff1f1;color:#b33;border-color:rgba(180,60,60,.25)}.collection.active{background:rgba(180,138,58,.14);color:var(--accent2);border-color:var(--borderStrong)}@media(max-width:420px){body{padding:10px}.card{width:100%}}</style></head><body><article class="card"><div class="card-head"><div class="perfume-name">BLEU</div><button class="brand-filter" type="button" title="Filter by CHANEL">CHANEL</button><div class="best"><span>★ BEST SELLER</span><span class="best-rank">#25</span></div></div><div class="card-image-wrap"><img class="card-image" src="https://raw.githubusercontent.com/MarvvRed/Shobi-Perfume-Inspiration/fragrantica-image-cache/images/126288.avif" alt="BLEU bottle"></div><div class="card-body"><div class="meta-row"><button class="filter-chip gender-chip" type="button" title="Filter Men"><i class="fa-solid fa-mars gender-fa"></i>Men</button><span class="meta-divider"></span><span class="season-group"><button class="season-chip" title="Filter Spring"><span class="season-icon">🌸</span></button><button class="season-chip" title="Filter Summer"><span class="season-icon">☀️</span></button><button class="season-chip" title="Filter Autumn"><span class="season-icon">🍂</span></button><button class="season-chip" title="Filter Winter"><span class="season-icon">❄️</span></button></span></div><div class="notes-title">Main notes</div><div class="notes"><button class="note-chip" title="Filter Grapefruit"><img class="note-icon" src="../note-icons/en/76.jpg">Grapefruit</button><button class="note-chip" title="Filter Lemon"><img class="note-icon" src="../note-icons/en/77.jpg">Lemon</button><button class="note-chip" title="Filter Mint"><img class="note-icon" src="../note-icons/en/160.jpg">Mint</button><button class="note-chip" title="Filter Pink Pepper"><img class="note-icon" src="../note-icons/en/91.jpg">Pink Pepper</button><button class="note-chip" title="Filter Ginger"><img class="note-icon" src="../note-icons/en/62.jpg">Ginger</button></div></div><div class="card-actions"><button class="action details" type="button"><i class="fa-regular fa-eye"></i>More detail</button><a class="action shop" href="https://leparfum.com.gr/en/elegant-perfume-inspired-by-bleu-de-chanel/" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i>SHOP ON SHOBI</a><div class="primary"><button class="action favorite" type="button" onclick="this.classList.toggle('active');this.innerHTML=this.classList.contains('active')?'♥ Favorite':'♡ Favorite'">♡ Favorite</button><button class="action collection" type="button" onclick="this.classList.toggle('active');this.innerHTML=this.classList.contains('active')?'✓ In Collection':'＋ Collection'">＋ Collection</button></div></div></article></body></html>
