name: Process Local Shobi Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - 'Shobi Master Database/incoming/shobi-live-latest.json'
      - 'scripts/process_shobi_incoming.py'
      - '.github/workflows/process-shobi-incoming.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: process-local-shobi-snapshot
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and compare incoming snapshot
        id: build
        shell: bash
        run: |
          set +e
          python scripts/process_shobi_incoming.py > process.log 2>&1
          CODE=$?
          cat process.log
          if [ "$CODE" -ne 0 ]; then
            tail -n 120 process.log > process-failure-summary.txt
            exit "$CODE"
          fi
          set -e
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          r=json.loads(Path('Shobi Master Database/latest-sync-report.json').read_text(encoding='utf-8'))
          for k in ('changed','new','modified','removed','shobi_perfumes','shobi_category_products','shobi_category_extra_products','shobi_category_missing_perfumes'):
              v=r[k]
              if isinstance(v,bool): v=str(v).lower()
              print(f'{k}={v}')
          PY

      - name: Promote validated snapshot and reports
        if: success()
        shell: bash
        run: |
          DATE="$(date -u +%F)"
          mkdir -p "Shobi Master Database/reports" "Shobi Master Database/snapshots"
          cp "Shobi Master Database/latest-sync-report.json" "Shobi Master Database/reports/latest.json"
          cp "Shobi Master Database/latest-sync-changes.csv" "Shobi Master Database/reports/latest-changes.csv"
          if [ "${{ steps.build.outputs.changed }}" = "true" ]; then
            cp "Shobi Master Database/shobi-master-candidate.csv" "Shobi Master Database/shobi-master-current.csv"
            cp "Shobi Master Database/shobi-master-candidate.csv" "Shobi Master Database/snapshots/${DATE}.csv"
            cp "Shobi Master Database/latest-sync-report.json" "Shobi Master Database/reports/${DATE}.json"
            cp "Shobi Master Database/latest-sync-changes.csv" "Shobi Master Database/reports/${DATE}-changes.csv"
          fi
          rm -f "Shobi Master Database/shobi-master-candidate.csv" "Shobi Master Database/latest-sync-report.json" "Shobi Master Database/latest-sync-changes.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Shobi Master Database/reports/latest.json" "Shobi Master Database/reports/latest-changes.csv"
          if [ "${{ steps.build.outputs.changed }}" = "true" ]; then
            git add "Shobi Master Database/shobi-master-current.csv" "Shobi Master Database/snapshots/${DATE}.csv" "Shobi Master Database/reports/${DATE}.json" "Shobi Master Database/reports/${DATE}-changes.csv"
          fi
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Process validated local Shobi snapshot ${DATE}"
            git push
          fi

      - name: Create issue when catalog changed
        if: success() && steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.build.outputs.new }}
          MODIFIED: ${{ steps.build.outputs.modified }}
          REMOVED: ${{ steps.build.outputs.removed }}
          TOTAL: ${{ steps.build.outputs.shobi_perfumes }}
          CATEGORY: ${{ steps.build.outputs.shobi_category_products }}
        shell: bash
        run: |
          gh issue create --title "Shobi Master updated from local authorized capture" --body "Validated local capture processed successfully.\n\n- NEW: ${NEW}\n- MODIFIED: ${MODIFIED}\n- REMOVED: ${REMOVED}\n- Current true Shobi perfumes: ${TOTAL}\n- /el/shobi products: ${CATEGORY}\n\nThe frozen baseline v1 was not modified."

      - name: Create failure issue with diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -f process-failure-summary.txt ]; then DETAILS="$(cat process-failure-summary.txt)"; else DETAILS="Failure happened before or outside snapshot validation."; fi
          printf 'Local Shobi snapshot processing FAILED. Master was NOT promoted.\n\nRun: %s\n\n```\n%s\n```\n' "$RUN_URL" "$DETAILS" > issue-body.txt
          gh issue create --title "Local Shobi snapshot validation FAILED" --body-file issue-body.txt
