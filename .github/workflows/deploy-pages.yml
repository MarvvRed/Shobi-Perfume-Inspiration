name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Official Catcher notes to deployed enrichment
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const baseDir='Personal Database';
          const runtime=JSON.parse(fs.readFileSync(`${baseDir}/site-runtime-v2.json`,'utf8'));
          const enrichmentDoc=JSON.parse(fs.readFileSync(`${baseDir}/site-enrichment-v2.json`,'utf8'));
          const catcher=JSON.parse(fs.readFileSync(`${baseDir}/fragrantica-main-notes.json`,'utf8'));
          const enrichment=enrichmentDoc.e||{}, catcherById=catcher.perfumes||{};
          const clean=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const codeKey=v=>String(v||'').toUpperCase().replace(/\s+/g,'');
          const fragIdFromUrl=url=>{const m=String(url||'').match(/-(\d+)\.html(?:[?#]|$)/i);return m?m[1]:'';};
          const perfumeByCode=new Map((runtime.p||[]).map(x=>[codeKey(x[0]),{code:x[0],name:x[1],brand:x[2]}]));

          const catcherByName=new Map();
          for(const [id,src] of Object.entries(catcherById)){
            const k=clean(src&&src.name);
            if(k&&!catcherByName.has(k)) catcherByName.set(k,{id:String(id),src});
          }

          function explicitAlias(p){
            if(!p)return null;
            const name=clean(p.name),brand=clean(p.brand);
            const aliases=[
              {id:'52616',names:['vanilla 28'],brands:['kayali']},{id:'34893',names:['soleil blanc'],brands:['tom ford']},{id:'6458',names:['bal d afrique','bal dafrique'],brands:['byredo']},
              {id:'9828',names:['aventus'],brands:['creed']},{id:'4322',names:['love don t be shy','love dont be shy'],brands:['kilian','by kilian']},{id:'39358',names:['this is her'],brands:['zadig voltaire','zadig volatire']},
              {id:'84933',names:['vanilla powder'],brands:['matiere premiere']},{id:'64757',names:['bianco latte'],brands:['giardini di toscana']},{id:'30529',names:['xj 1861 naxos','naxos'],brands:['xerjoff']},
              {id:'3865',names:['philosykos eau de parfum','philosykos'],brands:['diptyque']},{id:'83483',names:['goddess','burberry goddess'],brands:['burberry']}
            ];
            for(const a of aliases){
              const src=catcherById[a.id];
              if(!src)continue;
              const nm=a.names.some(n=>name===n||name.includes(n));
              const bm=!brand||a.brands.some(b=>brand.includes(b));
              if(nm&&bm)return {id:String(a.id),src};
            }
            return null;
          }

          const appliedRows=[],matchedIds=new Set();
          for(const [code,row] of Object.entries(enrichment)){
            if(!Array.isArray(row))continue;
            const fragId=fragIdFromUrl(row[4]);
            let match=fragId&&catcherById[fragId]?{id:String(fragId),src:catcherById[fragId]}:null;
            let matchedBy=match?'fragrantica-id':'';
            const p=perfumeByCode.get(codeKey(code));

            if(!match&&p){
              match=catcherByName.get(clean(p.name))||null;
              if(match)matchedBy='exact-name';
            }
            if(!match){
              match=explicitAlias(p);
              if(match)matchedBy='explicit-alias';
            }
            if(!match||!Array.isArray(match.src.notes)||!match.src.notes.length)continue;

            const src=match.src;
            row[2]=src.notes.slice().sort((a,b)=>(Number(a.rank)||999)-(Number(b.rank)||999)).slice(0,5).map(n=>String(n.note||'').trim()).filter(Boolean);
            matchedIds.add(String(match.id));
            appliedRows.push({code,perfume:src.name,fragrantica_id:String(src.fragrantica_id||match.id),catcher_key:String(match.id),matched_by:matchedBy,notes:row[2]});
          }

          const expected=Object.keys(catcherById).length;
          const applied=matchedIds.size;
          const missing=Object.entries(catcherById).filter(([id])=>!matchedIds.has(String(id))).map(([id,src])=>`${id}:${src.name}`);
          console.log(`Matched catcher keys: ${Array.from(matchedIds).sort((a,b)=>Number(a)-Number(b)).join(', ')}`);
          console.log(`Aventus catcher key 9828 matched: ${matchedIds.has('9828')}`);
          console.log(`Official Catcher unique records applied: ${applied}/${expected} (${appliedRows.length} site rows updated)`);
          appliedRows.forEach(x=>console.log(`${x.code} -> ${x.perfume} [${x.matched_by}] [catcher:${x.catcher_key}] -> ${x.notes.join(' | ')}`));
          if(missing.length)console.log('Missing catcher matches:',missing.join(' | '));
          if(applied!==expected)throw new Error(`Expected ${expected} unique catcher records, matched ${applied}. Deployment stopped to avoid partial data.`);

          fs.writeFileSync(`${baseDir}/site-enrichment-v2.json`,JSON.stringify(enrichmentDoc));
          const deployStatus={schema_version:1,success:true,workflow:'Deploy Pages',commit_sha:process.env.GITHUB_SHA||'',generated_at:new Date().toISOString(),catcher:'official-catcher-0.3.8',applied,expected,site_rows_updated:appliedRows.length,missing:[],matches:appliedRows};
          const statusJson=JSON.stringify(deployStatus,null,2)+'\n';
          fs.writeFileSync(`${baseDir}/deploy-status.json`,statusJson);
          fs.writeFileSync('deploy-status.json',statusJson);
          console.log(`Deploy status written: success=true, catcher=${applied}/${expected}, site_rows=${appliedRows.length}, sha=${deployStatus.commit_sha}`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
