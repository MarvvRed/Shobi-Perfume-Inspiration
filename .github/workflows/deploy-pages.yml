name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Official Catcher notes test to deployed enrichment
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const baseDir = 'Personal Database';
          const runtimePath = `${baseDir}/site-runtime-v2.json`;
          const enrichmentPath = `${baseDir}/site-enrichment-v2.json`;
          const catcherPath = `${baseDir}/fragrantica-main-notes.json`;

          const runtime = JSON.parse(fs.readFileSync(runtimePath, 'utf8'));
          const enrichmentDoc = JSON.parse(fs.readFileSync(enrichmentPath, 'utf8'));
          const catcher = JSON.parse(fs.readFileSync(catcherPath, 'utf8'));
          const enrichment = enrichmentDoc.e || {};
          const catcherById = catcher.perfumes || {};

          const clean = v => String(v || '')
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, ' ')
            .trim();
          const codeKey = v => String(v || '').toUpperCase().replace(/\s+/g, '');
          const fragIdFromUrl = url => {
            const m = String(url || '').match(/-(\d+)\.html(?:[?#]|$)/i);
            return m ? m[1] : '';
          };

          const perfumeByCode = new Map((runtime.p || []).map(x => [codeKey(x[0]), { code: x[0], name: x[1], brand: x[2] }]));
          const catcherByName = new Map();
          Object.values(catcherById).forEach(src => {
            const k = clean(src && src.name);
            if (k && !catcherByName.has(k)) catcherByName.set(k, src);
          });

          function explicitAlias(p) {
            if (!p) return null;
            const name = clean(p.name);
            const brand = clean(p.brand);
            // Vanilla 28 is stored in the site catalogue with extra Kayali wording,
            // so exact-name matching cannot resolve it. Restrict this alias to the
            // known Fragrantica record and Kayali identity only.
            if (catcherById['52616'] && name.includes('vanilla 28') && (name.includes('kayali') || brand.includes('kayali'))) {
              return catcherById['52616'];
            }
            return null;
          }

          let applied = 0;
          const appliedRows = [];
          for (const [code, row] of Object.entries(enrichment)) {
            if (!Array.isArray(row)) continue;
            const fragId = fragIdFromUrl(row[4]);
            let src = fragId && catcherById[fragId];
            let matchedBy = src ? 'fragrantica-id' : '';
            const p = perfumeByCode.get(codeKey(code));

            if (!src) {
              src = p && catcherByName.get(clean(p.name));
              if (src) matchedBy = 'exact-name';
            }

            if (!src) {
              src = explicitAlias(p);
              if (src) matchedBy = 'explicit-alias';
            }

            if (!src || !Array.isArray(src.notes) || !src.notes.length) continue;
            row[2] = src.notes
              .slice()
              .sort((a,b) => (Number(a.rank) || 999) - (Number(b.rank) || 999))
              .slice(0,5)
              .map(n => String(n.note || '').trim())
              .filter(Boolean);
            applied++;
            appliedRows.push(`${code} -> ${src.name} [${matchedBy}] -> ${row[2].join(' | ')}`);
          }

          console.log(`Official Catcher notes applied: ${applied}/${Object.keys(catcherById).length}`);
          appliedRows.forEach(x => console.log(x));
          const missing = Object.values(catcherById).filter(src => !appliedRows.some(row => row.includes(`-> ${src.name} [`))).map(src => `${src.fragrantica_id || '?'}:${src.name}`);
          if (missing.length) console.log('Missing catcher matches:', missing.join(' | '));
          if (applied !== Object.keys(catcherById).length) {
            throw new Error(`Expected to apply ${Object.keys(catcherById).length} catcher records, applied ${applied}. Deployment stopped to avoid partial test data.`);
          }

          fs.writeFileSync(enrichmentPath, JSON.stringify(enrichmentDoc));
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
