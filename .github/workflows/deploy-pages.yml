name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Site Catalog From Official Master"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate legacy catcher datasets and build ranking 41-100
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const csvPath='Shobi Master Database/bestseller-top100-enrichment.csv';
          const batch2140=JSON.parse(fs.readFileSync('Personal Database/fragrantica-main-notes-21-40.json','utf8'));
          const batch41100=JSON.parse(fs.readFileSync('Personal Database/fragrantica-main-notes-41-100.json','utf8'));

          function parseCsv(text){
            const rows=[]; let row=[],field='',q=false;
            for(let i=0;i<text.length;i++){
              const c=text[i];
              if(c==='"'){
                if(q&&text[i+1]==='"'){field+='"';i++;} else q=!q;
              } else if(c===','&&!q){row.push(field);field='';}
              else if((c==='\n'||c==='\r')&&!q){
                if(c==='\r'&&text[i+1]==='\n')i++;
                row.push(field); if(row.some(v=>v!==''))rows.push(row); row=[]; field='';
              } else field+=c;
            }
            if(field.length||row.length){row.push(field);rows.push(row);}
            return rows;
          }

          const rows=parseCsv(fs.readFileSync(csvPath,'utf8').replace(/^\uFEFF/,''));
          const header=rows.shift();
          const ir=header.indexOf('rank'), ic=header.indexOf('shobi_code'), im=header.indexOf('main_notes');
          if(ir<0||ic<0||im<0)throw new Error('Top100 enrichment CSV missing required columns');

          const byCode={};
          for(const row of rows){
            const rank=Number(row[ir]);
            if(rank<1||rank>20)continue;
            const code=String(row[ic]||'').trim();
            const notes=String(row[im]||'').split('|').map(v=>v.trim()).filter(Boolean).slice(0,5);
            if(!code||!notes.length)throw new Error(`Missing verified Top20 notes rank=${rank} code=${code}`);
            byCode[code]=notes.map(name=>[name,'']);
          }

          function addBatch(doc,min,max,expected,label){
            const rows=Array.isArray(doc.results)?doc.results:[];
            if(rows.length!==expected||Number(doc.success_count)!==expected||Number(doc.failure_count)!==0)
              throw new Error(`${label} incomplete`);
            const seen=new Set();
            for(const src of rows){
              const rank=Number(src.rank),code=String(src.shobi_code||'').trim();
              if(rank<min||rank>max||!code||!Array.isArray(src.notes)||!src.notes.length)
                throw new Error(`Invalid ${label} rank=${rank} code=${code}`);
              seen.add(rank);
              byCode[code]=src.notes.slice().sort((a,b)=>(Number(a.rank)||999)-(Number(b.rank)||999)).slice(0,5)
                .map(n=>[String(n.note||'').trim(),String(n.sastojak_id||'')]).filter(x=>x[0]);
            }
            for(let r=min;r<=max;r++)if(!seen.has(r))throw new Error(`Missing ${label} rank=${r}`);
          }

          addBatch(batch2140,21,40,20,'Playwright 21-40');
          addBatch(batch41100,41,100,60,'Playwright 41-100');
          if(Object.keys(byCode).length!==100)throw new Error(`Expected 100 catcher codes, got ${Object.keys(byCode).length}`);

          // bestseller-catcher-notes.js is versioned and contains the authoritative
          // Fragrantica social-card Top100 map. Never overwrite it from legacy Top5 data.

          const extension=batch41100.results
            .map(src=>({
              rank:Number(src.rank),
              code:String(src.shobi_code||'').trim(),
              notes:src.notes.slice().sort((a,b)=>(Number(a.rank)||999)-(Number(b.rank)||999)).slice(0,5)
                .map(n=>String(n.note||'').trim()).filter(Boolean)
            }))
            .sort((a,b)=>a.rank-b.rank);
          if(extension.length!==60||extension[0].rank!==41||extension[59].rank!==100)
            throw new Error('Ranking extension 41-100 incomplete');

          const runtime=`// Generated at deploy from verified Best Seller #41-100 catcher dataset.\n(function(){\n`+
            `const rows=${JSON.stringify(extension)};\n`+
            `const norm=v=>String(v||'').toUpperCase().replace(/\\s+/g,'');\n`+
            `const ranking=Array.isArray(window.SHOBI_BESTSELLER_RANKING)?window.SHOBI_BESTSELLER_RANKING.slice():[];\n`+
            `const ranks=new Set(ranking.map(x=>Number(x.rank)));\n`+
            `rows.forEach(x=>{if(!ranks.has(x.rank))ranking.push({rank:x.rank,code:x.code});});\n`+
            `ranking.sort((a,b)=>Number(a.rank)-Number(b.rank));\n`+
            `if(ranking.length!==100)throw new Error('Expected runtime Best Seller ranking length 100, got '+ranking.length);\n`+
            `window.SHOBI_BESTSELLER_RANKING=ranking;\n`+
            `window.SHOBI_BESTSELLER_CODES=ranking.map(x=>x.code);\n`+
            `window.SHOBI_BESTSELLER_RANK_BY_CODE=Object.fromEntries(ranking.map(x=>[x.code,x.rank]));\n`+
            `window.SHOBI_BESTSELLER_GLOBAL_RANK_BY_CODE=Object.fromEntries(ranking.filter(x=>x.globalRank!=null).map(x=>[x.code,x.globalRank]));\n`+
            `const enrich=window.SHOBI_TOP100_ENRICHMENT_BY_CODE||(window.SHOBI_TOP100_ENRICHMENT_BY_CODE={});\n`+
            `rows.forEach(x=>{enrich[norm(x.code)]={...(enrich[norm(x.code)]||{}),rank:x.rank,code:x.code,main_notes:x.notes,source_status:'verified-catcher'};});\n`+
            `})();\n`;
          fs.writeFileSync('bestseller-41-100-runtime.js',runtime);
          console.log('LEGACY_CATCHER_VALIDATION_OK',Object.keys(byCode).length,'RANKING_EXTENSION_OK',extension.length,'SOCIAL_CARD_NOTES_PRESERVED');
          NODE

      - name: Bust social-card runtime caches
        shell: bash
        run: |
          sed -i 's/bestseller-catcher-visual-check.js?v=8/bestseller-catcher-visual-check.js?v=9/g' index.html
          sed -i 's/fragrantica-note-icons.js?v=1/fragrantica-note-icons.js?v=2/g' index.html
          grep -q 'bestseller-catcher-visual-check.js?v=9' index.html
          grep -q 'fragrantica-note-icons.js?v=2' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
