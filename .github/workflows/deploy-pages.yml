name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Official Catcher notes test
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const indexPath = 'Personal Database/index.html';
          const patchPath = 'Personal Database/catcher-main-notes-test-inline.js';
          let html = fs.readFileSync(indexPath, 'utf8');
          const patch = fs.readFileSync(patchPath, 'utf8');
          const marker = '\nboot();\n';
          const pos = html.lastIndexOf(marker);
          if (pos < 0) throw new Error('boot() marker not found in Personal Database/index.html');
          html = html.slice(0, pos) + '\n' + patch + '\n' + html.slice(pos);
          fs.writeFileSync(indexPath, html);
          console.log('Injected Official Catcher 0.3.5 notes test before boot()');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
