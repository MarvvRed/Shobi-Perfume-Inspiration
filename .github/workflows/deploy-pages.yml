name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Site Catalog From Official Master"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply canonical bestseller ranks to root master
        run: python "Personal Database/scripts/apply_bestseller_rank_to_master.py"

      - name: Rebuild site runtime from root master
        run: python "Personal Database/scripts/rebuild_runtime_from_master.py"

      - name: Propagate canonical bestseller ranks to site runtime
        run: python "Personal Database/scripts/apply_master_rank_to_runtime.py"

      - name: Verify root master/runtime parity and Top 40 presence
        shell: bash
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          master_path=Path('shobi-master.csv')
          runtime_path=Path('Personal Database/site-runtime-v2.json')
          with master_path.open(encoding='utf-8-sig',newline='') as f:
              master=list(csv.DictReader(f))
          runtime=json.loads(runtime_path.read_text(encoding='utf-8'))
          products=runtime.get('p',[])
          assert runtime.get('count')==len(master)==len(products), (runtime.get('count'),len(master),len(products))
          ranked={int(p[6]):p[0] for p in products if isinstance(p,list) and len(p)>6 and p[6]}
          missing=[i for i in range(1,41) if i not in ranked]
          assert not missing, f'Missing runtime Top 40 ranks: {missing}'
          assert ranked[21].startswith('1644-DRC'), f'Rank 21 mismatch: {ranked.get(21)}'
          assert ranked[22].startswith('2398-FRE'), f'Rank 22 mismatch: {ranked.get(22)}'
          print('RUNTIME_GATE_PASS',len(products),'TOP40',[(i,ranked[i]) for i in range(1,41)])
          PY

      - name: Build source-locked Best Seller Top 100 enrichment overlay
        run: python scripts/apply_bestseller_top100_enrichment.py

      - name: Apply Official Catcher notes to deployed enrichment
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const baseDir='Personal Database';
          const runtime=JSON.parse(fs.readFileSync(`${baseDir}/site-runtime-v2.json`,'utf8'));
          const enrichmentDoc=JSON.parse(fs.readFileSync(`${baseDir}/site-enrichment-v2.json`,'utf8'));
          const catcher=JSON.parse(fs.readFileSync(`${baseDir}/fragrantica-main-notes.json`,'utf8'));
          const batch2140=JSON.parse(fs.readFileSync(`${baseDir}/fragrantica-main-notes-21-40.json`,'utf8'));
          const enrichment=enrichmentDoc.e||{}, catcherById=catcher.perfumes||{};
          const clean=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const codeKey=v=>String(v||'').toUpperCase().replace(/\s+/g,'');
          const fragIdFromUrl=url=>{const m=String(url||'').match(/-(\d+)\.html(?:[?#]|$)/i);return m?m[1]:'';};
          const perfumeByCode=new Map((runtime.p||[]).map(x=>[codeKey(x[0]),{code:x[0],name:x[1],brand:x[2]}]));
          const catcherByName=new Map();
          for(const [id,src] of Object.entries(catcherById)){const k=clean(src&&src.name);if(k&&!catcherByName.has(k))catcherByName.set(k,{id:String(id),src});}
          function explicitAlias(p){if(!p)return null;const name=clean(p.name),brand=clean(p.brand);const aliases=[{id:'52616',names:['vanilla 28'],brands:['kayali']},{id:'34893',names:['soleil blanc'],brands:['tom ford']},{id:'6458',names:['bal d afrique','bal dafrique'],brands:['byredo']},{id:'9828',names:['aventus','avent'],brands:['creed']},{id:'4322',names:['love don t be shy','love dont be shy'],brands:['kilian','by kilian']},{id:'39358',names:['this is her'],brands:['zadig voltaire','zadig volatire']},{id:'84933',names:['vanilla powder'],brands:['matiere premiere']},{id:'64757',names:['bianco latte'],brands:['giardini di toscana']},{id:'30529',names:['xj 1861 naxos','naxos'],brands:['xerjoff']},{id:'3865',names:['philosykos eau de parfum','philosykos'],brands:['diptyque']},{id:'83483',names:['goddess','burberry goddess'],brands:['burberry']}];for(const a of aliases){const src=catcherById[a.id];if(!src)continue;const nm=a.names.some(n=>name===n||name.includes(n));const bm=!brand||a.brands.some(b=>brand.includes(b));if(nm&&bm)return{id:String(a.id),src};}return null;}
          const appliedRows=[],matchedIds=new Set();
          for(const [code,row] of Object.entries(enrichment)){if(!Array.isArray(row))continue;const fragId=fragIdFromUrl(row[4]);let match=fragId&&catcherById[fragId]?{id:String(fragId),src:catcherById[fragId]}:null;let matchedBy=match?'fragrantica-id':'';const p=perfumeByCode.get(codeKey(code));if(!match&&p){match=catcherByName.get(clean(p.name))||null;if(match)matchedBy='exact-name';}if(!match){match=explicitAlias(p);if(match)matchedBy='explicit-alias';}if(!match||!Array.isArray(match.src.notes)||!match.src.notes.length)continue;const src=match.src;const sortedNotes=src.notes.slice().sort((a,b)=>(Number(a.rank)||999)-(Number(b.rank)||999)).slice(0,5);row[2]=sortedNotes.map(n=>String(n.note||'').trim()).filter(Boolean);const notePairs=sortedNotes.map(n=>[String(n.note||'').trim(),String(n.sastojak_id||'')]).filter(n=>n[0]);matchedIds.add(String(match.id));appliedRows.push({code,perfume:src.name,fragrantica_id:String(src.fragrantica_id||match.id),catcher_key:String(match.id),matched_by:matchedBy,notes:row[2],note_pairs:notePairs});}
          const expected=Object.keys(catcherById).length,applied=matchedIds.size;const missing=Object.entries(catcherById).filter(([id])=>!matchedIds.has(String(id))).map(([id,src])=>`${id}:${src.name}`);console.log(`Official Catcher unique records applied: ${applied}/${expected} (${appliedRows.length} site rows updated)`);if(missing.length)console.log('Missing catcher matches:',missing.join(' | '));if(applied!==expected)throw new Error(`Expected ${expected} unique catcher records, matched ${applied}. Deployment stopped to avoid partial data.`);fs.writeFileSync(`${baseDir}/site-enrichment-v2.json`,JSON.stringify(enrichmentDoc));
          const catcherNotesByCode={};
          appliedRows.forEach(x=>{catcherNotesByCode[String(x.code)]=x.note_pairs;});
          const batchRows=Array.isArray(batch2140.results)?batch2140.results:[];
          if(batchRows.length!==20||Number(batch2140.success_count)!==20||Number(batch2140.failure_count)!==0)throw new Error('Canonical Playwright batch 21-40 is incomplete.');
          for(const src of batchRows){const rank=Number(src.rank),code=String(src.shobi_code||'').trim();if(rank<21||rank>40||!code||!Array.isArray(src.notes)||!src.notes.length)throw new Error(`Invalid Playwright catcher row rank=${rank} code=${code}`);const notePairs=src.notes.slice().sort((a,b)=>(Number(a.rank)||999)-(Number(b.rank)||999)).slice(0,5).map(n=>[String(n.note||'').trim(),String(n.sastojak_id||'')]).filter(n=>n[0]);catcherNotesByCode[code]=notePairs;}
          const top40Codes=new Set(Object.keys(catcherNotesByCode));
          if(top40Codes.size<40)throw new Error(`Expected at least 40 catcher card codes, got ${top40Codes.size}`);
          fs.writeFileSync('bestseller-catcher-notes.js',`// Generated by Deploy Pages from Official Catcher #1-20 + canonical Playwright #21-40.\nwindow.SHOBI_CATCHER_NOTES_BY_CODE=${JSON.stringify(catcherNotesByCode)};\n`);
          const deployStatus={schema_version:1,success:true,workflow:'Deploy Pages',commit_sha:process.env.GITHUB_SHA||'',generated_at:new Date().toISOString(),catcher:'official-catcher-1-40',applied,expected,playwright_21_40:batchRows.length,site_rows_updated:appliedRows.length,catcher_card_codes:Object.keys(catcherNotesByCode).length,top100_overlay:'site-build/bestseller-top100-enrichment-overlay.json',top100_overlay_count:100,missing:[],matches:appliedRows};const statusJson=JSON.stringify(deployStatus,null,2)+'\n';fs.writeFileSync(`${baseDir}/deploy-status.json`,statusJson);fs.writeFileSync('deploy-status.json',statusJson);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
