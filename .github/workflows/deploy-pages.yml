name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply canonical bestseller ranks to Personal Database master
        run: python "Personal Database/scripts/apply_bestseller_rank_to_master.py"

      - name: Rebuild site runtime from current Personal Database master
        run: python "Personal Database/scripts/rebuild_runtime_from_master.py"

      - name: Propagate canonical bestseller ranks to site runtime
        run: python "Personal Database/scripts/apply_master_rank_to_runtime.py"

      - name: Verify runtime/catalog parity and Top 40 presence
        shell: bash
        run: |
          python - <<'PY'
          import csv,json,re
          from pathlib import Path
          base=Path('Personal Database')
          with (base/'shobi-master.csv').open(encoding='utf-8-sig',newline='') as f:
              master=list(csv.DictReader(f))
          runtime=json.loads((base/'site-runtime-v2.json').read_text(encoding='utf-8'))
          products=runtime.get('p',[])
          assert runtime.get('count')==len(master)==len(products), (runtime.get('count'),len(master),len(products))
          ranked={int(p[6]):p[0] for p in products if isinstance(p,list) and len(p)>6 and p[6]}
          missing=[i for i in range(1,41) if i not in ranked]
          assert not missing, f'Missing runtime Top 40 ranks: {missing}'
          print('RUNTIME_GATE_PASS',len(products),'TOP40',[(i,ranked[i]) for i in range(1,41)])
          PY

      - name: Build source-locked Best Seller Top 100 enrichment overlay
        run: python scripts/apply_bestseller_top100_enrichment.py

      - name: Apply Official Catcher notes to deployed enrichment
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const baseDir='Personal Database';
          const runtime=JSON.parse(fs.readFileSync(`${baseDir}/site-runtime-v2.json`,'utf8'));
          const enrichmentDoc=JSON.parse(fs.readFileSync(`${baseDir}/site-enrichment-v2.json`,'utf8'));
          const catcher=JSON.parse(fs.readFileSync(`${baseDir}/fragrantica-main-notes.json`,'utf8'));
          const enrichment=enrichmentDoc.e||{}, catcherById=catcher.perfumes||{};
          const clean=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
          const codeKey=v=>String(v||'').toUpperCase().replace(/\s+/g,'');
          const fragIdFromUrl=url=>{const m=String(url||'').match(/-(\d+)\.html(?:[?#]|$)/i);return m?m[1]:'';};
          const perfumeByCode=new Map((runtime.p||[]).map(x=>[codeKey(x[0]),{code:x[0],name:x[1],brand:x[2]}]));
          const catcherByName=new Map();
          for(const [id,src] of Object.entries(catcherById)){const k=clean(src&&src.name);if(k&&!catcherByName.has(k))catcherByName.set(k,{id:String(id),src});}
          function explicitAlias(p){if(!p)return null;const name=clean(p.name),brand=clean(p.brand);const aliases=[{id:'52616',names:['vanilla 28'],brands:['kayali']},{id:'34893',names:['soleil blanc'],brands:['tom ford']},{id:'6458',names:['bal d afrique','bal dafrique'],brands:['byredo']},{id:'9828',names:['aventus','avent'],brands:['creed']},{id:'4322',names:['love don t be shy','love dont be shy'],brands:['kilian','by kilian']},{id:'39358',names:['this is her'],brands:['zadig voltaire','zadig volatire']},{id:'84933',names:['vanilla powder'],brands:['matiere premiere']},{id:'64757',names:['bianco latte'],brands:['giardini di toscana']},{id:'30529',names:['xj 1861 naxos','naxos'],brands:['xerjoff']},{id:'3865',names:['philosykos eau de parfum','philosykos'],brands:['diptyque']},{id:'83483',names:['goddess','burberry goddess'],brands:['burberry']}];for(const a of aliases){const src=catcherById[a.id];if(!src)continue;const nm=a.names.some(n=>name===n||name.includes(n));const bm=!brand||a.brands.some(b=>brand.includes(b));if(nm&&bm)return{id:String(a.id),src};}return null;}
          const appliedRows=[],matchedIds=new Set();
          for(const [code,row] of Object.entries(enrichment)){if(!Array.isArray(row))continue;const fragId=fragIdFromUrl(row[4]);let match=fragId&&catcherById[fragId]?{id:String(fragId),src:catcherById[fragId]}:null;let matchedBy=match?'fragrantica-id':'';const p=perfumeByCode.get(codeKey(code));if(!match&&p){match=catcherByName.get(clean(p.name))||null;if(match)matchedBy='exact-name';}if(!match){match=explicitAlias(p);if(match)matchedBy='explicit-alias';}if(!match||!Array.isArray(match.src.notes)||!match.src.notes.length)continue;const src=match.src;const sortedNotes=src.notes.slice().sort((a,b)=>(Number(a.rank)||999)-(Number(b.rank)||999)).slice(0,5);row[2]=sortedNotes.map(n=>String(n.note||'').trim()).filter(Boolean);const notePairs=sortedNotes.map(n=>[String(n.note||'').trim(),String(n.sastojak_id||'')]).filter(n=>n[0]);matchedIds.add(String(match.id));appliedRows.push({code,perfume:src.name,fragrantica_id:String(src.fragrantica_id||match.id),catcher_key:String(match.id),matched_by:matchedBy,notes:row[2],note_pairs:notePairs});}
          const expected=Object.keys(catcherById).length,applied=matchedIds.size;const missing=Object.entries(catcherById).filter(([id])=>!matchedIds.has(String(id))).map(([id,src])=>`${id}:${src.name}`);console.log(`Official Catcher unique records applied: ${applied}/${expected} (${appliedRows.length} site rows updated)`);if(missing.length)console.log('Missing catcher matches:',missing.join(' | '));if(applied!==expected)throw new Error(`Expected ${expected} unique catcher records, matched ${applied}. Deployment stopped to avoid partial data.`);fs.writeFileSync(`${baseDir}/site-enrichment-v2.json`,JSON.stringify(enrichmentDoc));const catcherNotesByCode={};appliedRows.forEach(x=>{catcherNotesByCode[String(x.code)]=x.note_pairs;});fs.writeFileSync('bestseller-catcher-notes.js',`// Generated by Deploy Pages from Official Catcher 0.3.8.\nwindow.SHOBI_CATCHER_NOTES_BY_CODE=${JSON.stringify(catcherNotesByCode)};\n`);const deployStatus={schema_version:1,success:true,workflow:'Deploy Pages',commit_sha:process.env.GITHUB_SHA||'',generated_at:new Date().toISOString(),catcher:'official-catcher-0.3.8',applied,expected,site_rows_updated:appliedRows.length,catcher_card_codes:Object.keys(catcherNotesByCode).length,top100_overlay:'site-build/bestseller-top100-enrichment-overlay.json',top100_overlay_count:100,missing:[],matches:appliedRows};const statusJson=JSON.stringify(deployStatus,null,2)+'\n';fs.writeFileSync(`${baseDir}/deploy-status.json`,statusJson);fs.writeFileSync('deploy-status.json',statusJson);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
