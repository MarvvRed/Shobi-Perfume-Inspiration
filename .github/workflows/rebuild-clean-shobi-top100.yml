name: Rebuild Clean Shobi Top100

on:
  workflow_dispatch:
  push:
    paths:
      - 'shobi-best-sales-raw.csv'
      - 'shobi-master-en.csv'
      - 'scripts/rebuild_clean_shobi_top100.py'
      - '.github/workflows/rebuild-clean-shobi-top100.yml'

permissions:
  contents: write

concurrency:
  group: rebuild-clean-shobi-top100
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild clean Shobi Top100 from real-browser snapshot
        run: python scripts/rebuild_clean_shobi_top100.py

      - name: Validate clean Top100
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('Fragrantica ID Database/rebuild-top100/shobi-top100-clean.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          rows=d['records']
          assert d['count']==100 and len(rows)==100
          assert [r['rank'] for r in rows]==list(range(1,101))
          assert len({r['shobi_code'] for r in rows})==100
          assert all(r['global_rank']>=r['rank'] for r in rows)
          assert all(r['shobi_code'] for r in rows)
          assert d['source_snapshot']=='shobi-best-sales-raw.csv'
          assert d['master_source']=='shobi-master-en.csv'
          print('CLEAN_SHOBI_TOP100_VALIDATION_PASS')
          PY

      - name: Commit clean Top100 snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Fragrantica ID Database/rebuild-top100/shobi-top100-clean.json'
          if git diff --cached --quiet; then
            echo 'No clean Top100 changes.'
          else
            git commit -m 'Build clean Shobi Top100 from browser snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
