name: Sync English Shobi Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - 'scripts/build_shobi_master_en.py'
      - 'scripts/build_shobi_bestseller_ranking.py'
      - '.github/workflows/build-shobi-master-en.yml'
  pull_request:
    paths:
      - 'scripts/build_shobi_master_en.py'
      - 'scripts/build_shobi_bestseller_ranking.py'
      - '.github/workflows/build-shobi-master-en.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-english-shobi-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: pip install requests beautifulsoup4

      - name: Build safe English catalog candidate
        run: python scripts/build_shobi_master_en.py

      - name: Show catalog diff summary
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          def rows(path):
              with Path(path).open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))
          old=rows('shobi-master.csv')
          new=rows('shobi-master-en.csv')
          old_codes={r.get('shobi_code','') for r in old}
          new_codes={r.get('shobi_code','') for r in new}
          print(f'OLD_ROWS={len(old)}')
          print(f'NEW_ROWS={len(new)}')
          print(f'ADDED={len(new_codes-old_codes)}')
          print(f'REMOVED={len(old_codes-new_codes)}')
          if old_codes-new_codes:
              raise SystemExit('Safety stop: candidate removed catalog codes')
          PY

      - name: Build perfume-only Best Seller ranking
        run: python scripts/build_shobi_bestseller_ranking.py

      - name: Keep candidates as artifacts on pull requests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: shobi-sync-candidates
          path: |
            shobi-master-en.csv
            bestseller-ranking.js

      - name: Promote validated English catalog and ranking on main
        id: promote
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cp shobi-master-en.csv shobi-master.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shobi-master.csv shobi-master-en.csv bestseller-ranking.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Shobi catalog/ranking changes."
            exit 0
          fi
          git commit -m "Sync English Shobi catalog and bestseller ranking"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated catalog to GitHub Pages
        if: steps.promote.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
