name: Build English Shobi Master

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_shobi_master_en.py'
      - '.github/workflows/build-shobi-master-en.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: pip install requests beautifulsoup4

      - name: Build validated English candidate
        run: python scripts/build_shobi_master_en.py

      - name: Commit candidate only after validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shobi-master-en.csv
          git diff --cached --quiet && exit 0
          git commit -m "Build validated English Shobi master candidate"
          git push
