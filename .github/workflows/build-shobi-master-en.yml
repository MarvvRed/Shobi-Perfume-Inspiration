name: Build English Shobi Master

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_shobi_master_en.py'
      - '.github/workflows/build-shobi-master-en.yml'
  pull_request:
    paths:
      - 'scripts/build_shobi_master_en.py'
      - '.github/workflows/build-shobi-master-en.yml'

permissions:
  contents: read

jobs:
  audit-brands:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit missing brands only
        run: python scripts/audit_missing_brands.py
