name: Build Best Seller 101-200 Fragrantica Map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-bestseller-101-200-fragrantica-map.yml'
      - 'scripts/build-bestseller-101-200-fragrantica-map.py'
      - 'Personal Database/bestseller-101-200.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Join 101-200 to Master and Fragrantica IDs
        run: python scripts/build-bestseller-101-200-fragrantica-map.py
      - name: Persist verified map
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Personal Database/bestseller-101-200-fragrantica-map.json'
          if git diff --cached --quiet; then
            echo 'No map changes to commit'
          else
            git commit -m 'Persist Best Seller 101-200 Fragrantica map'
            git push origin main
          fi
