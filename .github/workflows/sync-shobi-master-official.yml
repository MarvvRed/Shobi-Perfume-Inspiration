name: Sync Official Shobi Master (Direct diagnostic only)

# Direct access from GitHub-hosted runners is blocked by leparfum.com.gr
# (browser challenge / connection reset). The official weekly path is now:
# Windows local authorized capture -> incoming snapshot -> Process Local Shobi Snapshot.
# Keep this workflow manual only for future diagnostics.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain disabled direct path
        run: |
          echo "Direct Shobi acquisition from GitHub-hosted runners is intentionally disabled."
          echo "Use local-agent/shobi_local_capture.py on the authorized Windows machine."
          echo "The pushed incoming snapshot is validated by .github/workflows/process-shobi-incoming.yml."
