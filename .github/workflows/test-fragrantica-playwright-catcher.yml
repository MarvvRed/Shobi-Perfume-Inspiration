name: Test Fragrantica Playwright Catcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catcher:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      FRAGRANTICA_URL: https://www.fragrantica.com/perfume/Dior/Sauvage-Elixir-68415.html
      FRAGRANTICA_NAME: Sauvage Elixir
      SHOBI_RANK: '21'
      SHOBI_CODE: 1644-DRC M
      SHOBI_CDP_URL: http://127.0.0.1:9222
      SHOBI_CATCHER_OUT: ${{ github.workspace }}\tools\fragrantica-main-notes\results\playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright client
        shell: cmd
        run: |
          call npm init -y
          call npm install --no-save playwright@1.55.0

      - name: Verify real Chrome debugging endpoint
        shell: cmd
        run: curl.exe --fail --silent --show-error http://127.0.0.1:9222/json/version

      - name: Capture Sauvage Elixir Top 5 voted notes
        shell: cmd
        run: node tools\fragrantica-main-notes\playwright-catcher.cjs

      - name: Upload catcher result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fragrantica-playwright-sauvage-elixir
          path: tools/fragrantica-main-notes/results/playwright/*.json
          if-no-files-found: warn
