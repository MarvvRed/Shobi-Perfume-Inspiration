name: Test Fragrantica Playwright Catcher

on:
  workflow_dispatch:
    inputs:
      login_mode:
        description: 'Open persistent browser profile for one-time Fragrantica login'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  catcher:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    env:
      FRAGRANTICA_URL: https://www.fragrantica.com/perfume/Dior/Sauvage-Elixir-68415.html
      FRAGRANTICA_NAME: Sauvage Elixir
      SHOBI_RANK: '21'
      SHOBI_CODE: 1644-DRC M
      SHOBI_FRAGRANTICA_PROFILE: ${{ env.USERPROFILE }}\.shobi-fragrantica-playwright-profile
      SHOBI_CATCHER_OUT: ${{ github.workspace }}\tools\fragrantica-main-notes\results\playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        shell: powershell
        run: |
          npm init -y | Out-Null
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: One-time Fragrantica login
        if: ${{ inputs.login_mode }}
        shell: powershell
        run: node tools/fragrantica-main-notes/playwright-catcher.cjs --login

      - name: Capture Sauvage Elixir Top 5 voted notes
        if: ${{ !inputs.login_mode }}
        shell: powershell
        run: node tools/fragrantica-main-notes/playwright-catcher.cjs

      - name: Upload catcher result
        if: ${{ !inputs.login_mode && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fragrantica-playwright-sauvage-elixir
          path: tools/fragrantica-main-notes/results/playwright/*.json
          if-no-files-found: warn
