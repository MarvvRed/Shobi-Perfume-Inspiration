name: Sync English Master Brands

on:
  push:
    paths:
      - 'scripts/sync_master_en_brands.py'
      - '.github/workflows/sync-master-en-brands.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize brands safely
        run: python scripts/sync_master_en_brands.py
      - name: Commit synchronized English master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shobi-master-en.csv
          git diff --cached --quiet && exit 0
          git commit -m "Sync validated brands to English master"
          git push
