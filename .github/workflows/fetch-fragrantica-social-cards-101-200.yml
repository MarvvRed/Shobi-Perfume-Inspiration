name: Fetch Fragrantica Social Cards 101-200

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-fragrantica-social-cards-101-200.yml'
      - 'scripts/fetch-fragrantica-social-cards-101-200.mjs'
      - 'Personal Database/bestseller-101-200-fragrantica-resolved.json'
      - 'Personal Database/bestseller-101-200-fragrantica-manual.json'
      - 'Personal Database/bestseller-101-200-fragrantica-pass2.json'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch resolved social cards
        run: node scripts/fetch-fragrantica-social-cards-101-200.mjs
      - name: Persist social card manifest
        shell: bash
        run: |
          cp artifacts/fragrantica-social-cards-101-200/manifest.json 'Personal Database/bestseller-101-200-social-card-manifest.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Personal Database/bestseller-101-200-social-card-manifest.json'
          if git diff --cached --quiet; then
            echo 'No manifest changes to commit'
          else
            git commit -m 'Persist Best Seller 101-200 social card manifest'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload social cards
        uses: actions/upload-artifact@v4
        with:
          name: fragrantica-social-cards-101-200
          path: artifacts/fragrantica-social-cards-101-200
          if-no-files-found: error
