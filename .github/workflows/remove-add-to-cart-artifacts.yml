name: Remove Add To Cart Artifacts
on:
  push:
    paths:
      - 'scripts/remove_add_to_cart_artifacts.py'
      - '.github/workflows/remove-add-to-cart-artifacts.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/remove_add_to_cart_artifacts.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shobi-master.csv shobi-master-en.csv
          git diff --cached --quiet && exit 0
          git commit -m "Remove scraped Add to cart artifacts"
          git push
