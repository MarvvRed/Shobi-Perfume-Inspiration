name: Extract Social Card Notes 101-200

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-social-card-notes-101-200.yml'
      - 'scripts/extract-social-card-notes-101-200.py'
      - 'Personal Database/bestseller-101-200-social-card-manifest.json'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip pillow
      - name: Re-fetch social card images from persisted manifest
        run: |
          mkdir -p artifacts/fragrantica-social-cards-101-200
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          data=json.loads(Path('Personal Database/bestseller-101-200-social-card-manifest.json').read_text())
          out=Path('artifacts/fragrantica-social-cards-101-200')
          ok=0
          for r in data:
              if not r.get('ok'): continue
              rank=int(r['rank']); fid=int(r['fragrantica_id']); url=r['url']
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as res:
                  b=res.read()
              if len(b)>1000:
                  (out/f'{rank:03d}-{fid}.jpeg').write_bytes(b); ok+=1
          print('REFETCHED',ok)
          if ok < 90: raise SystemExit('Safety stop: fewer than 90 social cards refetched')
          PY
      - name: Extract note labels from fixed social-card grid
        run: python scripts/extract-social-card-notes-101-200.py
      - name: Persist OCR candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Personal Database/bestseller-101-200-social-card-notes-ocr.json'
          if git diff --cached --quiet; then
            echo 'No OCR changes to commit'
          else
            git commit -m 'Persist Best Seller 101-200 social card note OCR'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bestseller-101-200-social-card-note-ocr
          path: Personal Database/bestseller-101-200-social-card-notes-ocr.json
          if-no-files-found: error
