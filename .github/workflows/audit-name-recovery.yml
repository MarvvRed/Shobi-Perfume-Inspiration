name: Audit Name Recovery

on:
  push:
    paths:
      - 'scripts/audit_name_recovery.py'
      - '.github/workflows/audit-name-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analyze suspicious names
        run: python scripts/audit_name_recovery.py > audit-name-recovery-report.txt
      - name: Publish report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-name-recovery-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update suspicious name recovery report"
          git push
