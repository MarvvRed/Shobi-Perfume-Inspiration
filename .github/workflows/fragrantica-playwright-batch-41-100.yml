name: Fragrantica Playwright Batch 41-100

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/triggers/fragrantica-41-100.txt'

permissions:
  contents: write

jobs:
  catcher-batch:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    env:
      SHOBI_CDP_URL: http://127.0.0.1:9222
      SHOBI_CATCHER_OUT: ${{ github.workspace }}\tools\fragrantica-main-notes\results\playwright-41-100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright client
        shell: cmd
        run: |
          call npm init -y
          call npm install --no-save playwright@1.55.0

      - name: Verify Edge debugging endpoint
        shell: cmd
        run: curl.exe --fail --silent --show-error http://127.0.0.1:9222/json/version

      - name: Capture source-locked Fragrantica ranks 41-100
        id: capture
        continue-on-error: true
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:SHOBI_CATCHER_OUT" | Out-Null
          & node tools\fragrantica-main-notes\playwright-batch-41-100-v2.cjs 2>&1 | Tee-Object -FilePath "$env:SHOBI_CATCHER_OUT\run.log"
          if ($LASTEXITCODE -ne 0) { "CAPTURE_EXIT=$LASTEXITCODE" | Out-File "$env:SHOBI_CATCHER_OUT\capture-exit.txt" -Encoding utf8 }
          exit $LASTEXITCODE

      - name: Persist diagnostics to repository
        if: ${{ always() }}
        shell: powershell
        run: |
          $dest = "Personal Database\diagnostics\fragrantica-41-100"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem "$env:SHOBI_CATCHER_OUT" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $dest -Force }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dest"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Persist Fragrantica 41-100 diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          }

      - name: Upload batch results and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fragrantica-playwright-41-100
          path: tools/fragrantica-main-notes/results/playwright-41-100/*
          if-no-files-found: warn

      - name: Fail workflow if capture failed
        if: ${{ steps.capture.outcome == 'failure' }}
        shell: cmd
        run: exit /b 1
