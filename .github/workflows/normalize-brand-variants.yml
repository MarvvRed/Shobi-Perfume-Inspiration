name: Normalize Brand Variants
on:
  push:
    paths:
      - 'scripts/normalize_brand_variants.py'
      - '.github/workflows/normalize-brand-variants.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/normalize_brand_variants.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shobi-master.csv shobi-master-en.csv
          git diff --cached --quiet && exit 0
          git commit -m "Normalize cosmetic brand variants"
          git push
