name: Sync Fragrantica Note Icons

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-fragrantica-note-icons.mjs'
      - '.github/workflows/sync-fragrantica-note-icons.yml'
      - 'data/fragrantica-note-icons/README.md'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build official note icon registry
        run: node scripts/sync-fragrantica-note-icons.mjs
      - name: Commit registry if changed
        shell: bash
        run: |
          if git diff --quiet -- fragrantica-note-icons.js data/fragrantica-note-icons/registry.json; then
            echo 'No registry changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fragrantica-note-icons.js data/fragrantica-note-icons/registry.json
          git commit -m 'Sync Fragrantica note icon registry'
          git push origin main
