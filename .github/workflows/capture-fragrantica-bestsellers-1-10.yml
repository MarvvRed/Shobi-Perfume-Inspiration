name: Capture Fragrantica Bestsellers 1-10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-fragrantica-bestsellers-1-10.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5

    steps:
      - name: CMD baseline
        shell: cmd
        run: |
          @echo off
          echo === CMD BASELINE ===
          echo COMPUTERNAME=%COMPUTERNAME%
          echo USERNAME=%USERNAME%
          echo CD=%CD%
          echo CMD_BASELINE_OK
          exit /b 0

      - name: Node check
        shell: cmd
        run: |
          @echo off
          echo === NODE CHECK ===
          where node >nul 2>nul
          if errorlevel 1 (
            echo NODE_NOT_FOUND
          ) else (
            node --version
          )
          where npm >nul 2>nul
          if errorlevel 1 (
            echo NPM_NOT_FOUND
          ) else (
            call npm --version
          )
          echo NODE_STAGE_OK
          exit /b 0

      - name: PowerShell executable check
        shell: cmd
        run: |
          @echo off
          echo === POWERSHELL CHECK ===
          where powershell >nul 2>nul
          if errorlevel 1 (
            echo POWERSHELL_NOT_FOUND
            exit /b 0
          )
          powershell -NoProfile -NonInteractive -Command "$PSVersionTable.PSVersion.ToString(); Write-Output 'POWERSHELL_EXEC_OK'"
          if errorlevel 1 (
            echo POWERSHELL_EXEC_FAILED
            exit /b 0
          )
          echo POWERSHELL_STAGE_OK
          exit /b 0

      - name: Edge discovery only
        shell: cmd
        run: |
          @echo off
          echo === EDGE DISCOVERY ===
          set "EDGE1=%ProgramFiles(x86)%\Microsoft\Edge\Application\msedge.exe"
          set "EDGE2=%ProgramFiles%\Microsoft\Edge\Application\msedge.exe"
          if exist "%EDGE1%" (
            echo EDGE_FOUND=%EDGE1%
            "%EDGE1%" --version
            echo EDGE_STAGE_OK
            exit /b 0
          )
          if exist "%EDGE2%" (
            echo EDGE_FOUND=%EDGE2%
            "%EDGE2%" --version
            echo EDGE_STAGE_OK
            exit /b 0
          )
          echo EDGE_NOT_FOUND
          exit /b 0
