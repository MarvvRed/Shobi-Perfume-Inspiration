name: Capture Fragrantica Bestsellers 1-10

on:
  push:
    branches: [main]
    paths:
      - 'tools/fragrantica-main-notes/auto-capture-bestsellers-1-10.mjs'
      - 'tools/fragrantica-main-notes/batches/bestsellers-1-10.json'
      - '.github/workflows/capture-fragrantica-bestsellers-1-10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        shell: pwsh
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Capture Fragrantica Main Notes
        shell: pwsh
        run: node tools/fragrantica-main-notes/auto-capture-bestsellers-1-10.mjs

      - name: Commit capture results
        if: always()
        shell: pwsh
        run: |
          $RESULT = 'tools/fragrantica-main-notes/results/bestsellers-1-10-auto.json'
          if (-not (Test-Path $RESULT)) {
            Write-Error 'Capture result file was not produced.'
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $RESULT
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No result changes to commit.'
            exit 0
          }
          git commit -m 'Update Fragrantica bestseller 1-10 capture results'
          git push
