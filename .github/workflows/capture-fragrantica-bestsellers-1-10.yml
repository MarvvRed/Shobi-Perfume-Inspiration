name: Capture Fragrantica Bestsellers 1-10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-fragrantica-bestsellers-1-10.yml'
      - 'tools/fragrantica-main-notes/local-github-bridge.cjs'
      - 'tools/fragrantica-main-notes/firefox-extension/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35

    steps:
      - name: Start Firefox to GitHub local bridge
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          echo === SHOBI FIREFOX GITHUB BRIDGE ===

          set "NODEEXE="
          where node >nul 2>nul
          if not errorlevel 1 for /f "delims=" %%I in ('where node') do if not defined NODEEXE set "NODEEXE=%%I"

          if not defined NODEEXE (
            set "RUNTIME=%RUNNER_TEMP%\shobi-node"
            set "NODEDIR=!RUNTIME!\node-v22.18.0-win-x64"
            set "NODEZIP=!RUNTIME!\node.zip"
            if not exist "!RUNTIME!" mkdir "!RUNTIME!"
            if not exist "!NODEDIR!\node.exe" (
              curl.exe -L --fail --silent --show-error "https://nodejs.org/dist/v22.18.0/node-v22.18.0-win-x64.zip" -o "!NODEZIP!"
              if errorlevel 1 exit /b 1
              tar.exe -xf "!NODEZIP!" -C "!RUNTIME!"
              if errorlevel 1 exit /b 1
            )
            set "NODEEXE=!NODEDIR!\node.exe"
          )

          set "WORK=%RUNNER_TEMP%\shobi-firefox-bridge"
          if not exist "!WORK!" mkdir "!WORK!"
          cd /d "!WORK!"

          curl.exe -L --fail --silent --show-error "https://raw.githubusercontent.com/MarvvRed/Shobi-Perfume-Inspiration/main/tools/fragrantica-main-notes/local-github-bridge.cjs" -o local-github-bridge.cjs
          if errorlevel 1 exit /b 1

          echo Bridge will listen on 127.0.0.1:8765 for 30 minutes.
          "!NODEEXE!" local-github-bridge.cjs
