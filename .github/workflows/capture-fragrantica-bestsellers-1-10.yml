name: Capture Fragrantica Bestsellers 1-10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-fragrantica-bestsellers-1-10.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5

    steps:
      - name: Deterministic CMD smoke test
        shell: cmd
        run: |
          @echo off
          echo === SHOBI DETERMINISTIC SMOKE TEST ===
          echo COMPUTERNAME=%COMPUTERNAME%
          echo USERNAME=%USERNAME%
          echo CD=%CD%
          echo.
          echo [cmd]
          where cmd >nul 2>nul
          if errorlevel 1 (echo NOT_FOUND) else (where cmd)
          echo.
          echo [powershell]
          where powershell >nul 2>nul
          if errorlevel 1 (echo NOT_FOUND) else (where powershell)
          echo.
          echo SHOBI_SMOKE_OK
          exit /b 0

      - name: Node check only
        shell: cmd
        run: |
          @echo off
          echo === NODE CHECK ===
          where node >nul 2>nul
          if errorlevel 1 (
            echo NODE_NOT_FOUND
            exit /b 0
          )
          node --version
          where npm >nul 2>nul
          if errorlevel 1 (
            echo NPM_NOT_FOUND
            exit /b 0
          )
          call npm --version
          echo NODE_CHECK_OK
          exit /b 0
