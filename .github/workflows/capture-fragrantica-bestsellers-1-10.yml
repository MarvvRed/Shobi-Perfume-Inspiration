name: Capture Fragrantica Bestsellers 1-10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-fragrantica-bestsellers-1-10.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5

    steps:
      - name: Deterministic CMD smoke test
        shell: cmd
        run: |
          @echo off
          echo === SHOBI DETERMINISTIC SMOKE TEST ===
          echo COMPUTERNAME=%COMPUTERNAME%
          echo USERNAME=%USERNAME%
          echo CD=%CD%
          echo.
          echo [cmd]
          where cmd >nul 2>nul
          if errorlevel 1 (echo NOT_FOUND) else (where cmd)
          echo.
          echo [powershell]
          where powershell >nul 2>nul
          if errorlevel 1 (echo NOT_FOUND) else (where powershell)
          echo.
          echo [node]
          where node >nul 2>nul
          if errorlevel 1 (echo NOT_FOUND) else (where node)
          echo.
          echo [npm]
          where npm >nul 2>nul
          if errorlevel 1 (echo NOT_FOUND) else (where npm)
          echo.
          echo [msedge]
          where msedge >nul 2>nul
          if errorlevel 1 (echo NOT_FOUND) else (where msedge)
          echo.
          echo SHOBI_SMOKE_OK
          exit /b 0
