name: Capture Fragrantica Bestsellers 1-10

on:
  push:
    branches: [main]
    paths:
      - 'tools/fragrantica-main-notes/auto-capture-bestsellers-1-10.mjs'
      - 'tools/fragrantica-main-notes/batches/bestsellers-1-10.json'
      - '.github/workflows/capture-fragrantica-bestsellers-1-10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture Fragrantica Main Notes
        run: node tools/fragrantica-main-notes/auto-capture-bestsellers-1-10.mjs

      - name: Commit capture results
        run: |
          if git diff --quiet -- tools/fragrantica-main-notes/results/bestsellers-1-10-auto.json; then
            echo 'No result changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/fragrantica-main-notes/results/bestsellers-1-10-auto.json
          git commit -m 'Update Fragrantica bestseller 1-10 capture results'
          git push
