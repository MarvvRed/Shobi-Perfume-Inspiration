name: Capture Fragrantica Bestsellers 1-10

on:
  push:
    branches: [main]
    paths:
      - 'tools/fragrantica-main-notes/auto-capture-bestsellers-1-10.mjs'
      - 'tools/fragrantica-main-notes/batches/bestsellers-1-10.json'
      - '.github/workflows/capture-fragrantica-bestsellers-1-10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Preflight runner diagnostics
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "=== RUNNER PRECHECK ==="
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "Runner workspace: $env:GITHUB_WORKSPACE"
          Write-Host "PATH: $env:PATH"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          foreach ($cmd in @('git','node','npm','npx')) {
            $found = Get-Command $cmd -ErrorAction SilentlyContinue
            if ($found) {
              Write-Host "$cmd => $($found.Source)"
              & $cmd --version
            } else {
              Write-Host "$cmd => NOT FOUND"
            }
          }
          Write-Host "Current dir: $(Get-Location)"
          Get-ChildItem -Force | Select-Object Name,Mode,Length
          Write-Host "=== END PRECHECK ==="

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository files
        shell: pwsh
        run: |
          Write-Host "Workspace after checkout: $env:GITHUB_WORKSPACE"
          Test-Path 'tools/fragrantica-main-notes/auto-capture-bestsellers-1-10.mjs'
          Test-Path 'tools/fragrantica-main-notes/batches/bestsellers-1-10.json'
          Get-ChildItem 'tools/fragrantica-main-notes' -Force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Node
        shell: pwsh
        run: |
          node --version
          npm --version
          npx --version

      - name: Install Playwright package
        shell: pwsh
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        shell: pwsh
        run: npx playwright install chromium

      - name: Smoke test Chromium
        shell: pwsh
        run: |
          node -e "const { chromium }=require('playwright'); (async()=>{const b=await chromium.launch({headless:true}); const p=await b.newPage(); await p.goto('https://example.com'); console.log(await p.title()); await b.close();})().catch(e=>{console.error(e);process.exit(1)})"

      - name: Capture Fragrantica Main Notes
        shell: pwsh
        run: node tools/fragrantica-main-notes/auto-capture-bestsellers-1-10.mjs

      - name: Commit capture results
        if: always()
        shell: pwsh
        run: |
          $RESULT = 'tools/fragrantica-main-notes/results/bestsellers-1-10-auto.json'
          if (-not (Test-Path $RESULT)) {
            Write-Host 'Capture result file was not produced.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $RESULT
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No result changes to commit.'
            exit 0
          }
          git commit -m 'Update Fragrantica bestseller 1-10 capture results'
          git push
