name: Capture Fragrantica Bestsellers 1-10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-fragrantica-bestsellers-1-10.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5

    steps:
      - name: Bare runner smoke test
        shell: cmd
        run: |
          echo === SHOBI RUNNER SMOKE TEST ===
          ver
          echo COMPUTERNAME=%COMPUTERNAME%
          echo USERNAME=%USERNAME%
          echo CD=%CD%
          where cmd
          where powershell
          where git
          where node
          timeout /t 20 /nobreak
          echo RUNNER_SMOKE_OK
