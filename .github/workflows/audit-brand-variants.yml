name: Audit Brand Variants
on:
  push:
    paths:
      - 'scripts/audit_brand_variants.py'
      - '.github/workflows/audit-brand-variants.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_brand_variants.py > audit-brand-variants-report.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-brand-variants-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update brand variants audit report"
          git push
