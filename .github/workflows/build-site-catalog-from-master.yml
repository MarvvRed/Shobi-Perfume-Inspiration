name: Build Site Catalog From Official Master

on:
  workflow_dispatch:
  push:
    paths:
      - 'Shobi Master Database/shobi-master-current.csv'
      - 'scripts/build_site_catalog_from_master.py'
      - '.github/workflows/build-site-catalog-from-master.yml'

permissions:
  contents: write

concurrency:
  group: build-site-catalog-from-master
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build staging site catalog
        run: python scripts/build_site_catalog_from_master.py

      - name: Persist staging candidate and audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Shobi Master Database/site-build/shobi-master-site-candidate.csv" \
                  "Shobi Master Database/site-build/site-build-report.json" \
                  "Shobi Master Database/site-build/site-build-unresolved.json" \
                  "Shobi Master Database/site-build/site-build-ambiguous.json"
          if git diff --cached --quiet; then
            echo "No staging build changes to commit."
          else
            git commit -m "Build site catalog candidate from official Shobi Master"
            git push
          fi

      - name: Confirm production site source unchanged
        run: |
          echo "STAGING ONLY: root shobi-master.csv was not replaced."
          echo "Review Shobi Master Database/site-build/site-build-report.json before promotion."
