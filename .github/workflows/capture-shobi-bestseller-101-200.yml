name: Capture Shobi Best Seller 101-200

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-shobi-bestseller-101-200.yml'
      - 'scripts/capture-shobi-bestseller-101-200.cjs'

permissions:
  contents: read

jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      SHOBI_CDP_URL: http://127.0.0.1:9222
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright client
        shell: cmd
        run: |
          call npm init -y
          call npm install --no-save playwright@1.55.0

      - name: Verify Edge debugging endpoint
        shell: cmd
        run: curl.exe --fail --silent --show-error http://127.0.0.1:9222/json/version

      - name: Capture ranks 101-200 from live Shobi Best Sales
        shell: cmd
        run: node scripts\capture-shobi-bestseller-101-200.cjs

      - name: Upload ranking batch
        uses: actions/upload-artifact@v4
        with:
          name: shobi-bestseller-101-200
          path: bestseller-101-200.json
          if-no-files-found: error
