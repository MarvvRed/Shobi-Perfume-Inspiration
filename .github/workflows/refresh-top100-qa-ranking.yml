name: Refresh QA Top 100 Ranking From Captured Sequence

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh_top100_qa_ranking.py'
      - '.github/workflows/refresh-top100-qa-ranking.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build first 100 captured Best Sellers that still exist in official Master
        run: python scripts/refresh_top100_qa_ranking.py
      - name: Commit QA ranking if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bestseller-ranking.js
          if git diff --cached --quiet; then
            echo "QA ranking unchanged."
            exit 0
          fi
          git commit -m "Refresh QA Top 100 against official Master"
          git push
