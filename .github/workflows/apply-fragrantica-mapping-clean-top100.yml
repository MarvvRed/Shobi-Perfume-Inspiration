name: Apply Fragrantica Mapping Clean Top100

on:
  workflow_dispatch:
  push:
    paths:
      - 'Fragrantica ID Database/rebuild-top100/shobi-top100-clean.json'
      - 'Fragrantica ID Database/mappings/bestseller-001-100.json'
      - 'scripts/apply_fragrantica_mapping_to_clean_top100.py'
      - '.github/workflows/apply-fragrantica-mapping-clean-top100.yml'

permissions:
  contents: write

concurrency:
  group: apply-fragrantica-mapping-clean-top100
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Fragrantica ID Mapping Rule
        run: python scripts/apply_fragrantica_mapping_to_clean_top100.py

      - name: Commit mapping audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Fragrantica ID Database/rebuild-top100/top100-fragrantica-mapped.json' 'Fragrantica ID Database/rebuild-top100/top100-fragrantica-unresolved.json'
          if git diff --cached --quiet; then
            echo 'No mapped Top100 changes.'
          else
            git commit -m 'Audit Fragrantica mapping for clean Top100'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Validate 100 percent Fragrantica identity coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('Fragrantica ID Database/rebuild-top100/top100-fragrantica-mapped.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          rows=d['records']
          assert d['target_count']==100
          assert d['identity_verified_count']==100, f"identity coverage {d['identity_verified_count']}/100"
          assert len(rows)==100
          assert [r['rank'] for r in rows]==list(range(1,101))
          assert len({r['shobi_code'] for r in rows})==100
          assert len({r['fragrantica_id'] for r in rows})==100
          assert all(r['fragrantica_url'] for r in rows)
          assert all(r['image_url'].endswith(f".{r['fragrantica_id']}.avif") for r in rows)
          assert all(r['social_card_url'].endswith(f"_{r['fragrantica_id']}.jpeg") for r in rows)
          assert all(r['verification']['mapping_join_key']=='shobi_code' for r in rows)
          print('FRAGRANTICA_MAPPING_CLEAN_TOP100_VALIDATION_PASS')
          PY
