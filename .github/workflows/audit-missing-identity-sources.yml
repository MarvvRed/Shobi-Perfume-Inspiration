name: Audit Missing Identity Sources
on:
  push:
    paths:
      - 'scripts/audit_missing_identity_sources.py'
      - '.github/workflows/audit-missing-identity-sources.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_missing_identity_sources.py > audit-missing-identity-sources-report.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-missing-identity-sources-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update missing identity sources audit report"
          git push
