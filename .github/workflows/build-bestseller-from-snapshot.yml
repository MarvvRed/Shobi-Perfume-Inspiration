name: Build Shobi Bestseller Ranking from Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - 'shobi-best-sales-raw.csv'
      - 'scripts/build_bestseller_from_snapshot.py'
      - 'shobi-master.csv'
      - '.github/workflows/build-bestseller-from-snapshot.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: build-shobi-bestseller-from-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Filter Best Sales to Shobi perfumes
        run: python scripts/build_bestseller_from_snapshot.py

      - name: Commit ranking if changed
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bestseller-ranking.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Ranking unchanged."
            exit 0
          fi
          git commit -m "Build perfume-only Shobi bestseller ranking"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated ranking
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
