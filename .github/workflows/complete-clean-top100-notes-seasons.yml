name: Complete Clean Top100 Seasons

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/capture_clean_top100_seasons.py'
      - '.github/workflows/complete-clean-top100-notes-seasons.yml'

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Capture public Fragrantica WHEN TO WEAR seasons for clean Top100
        run: python scripts/capture_clean_top100_seasons.py

      - name: Commit season evidence output
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'Fragrantica ID Database/rebuild-top100/top100-seasons.json' || true
          if git diff --cached --quiet; then
            echo 'No season output changes to commit.'
          else
            git commit -m 'Capture canonical Top100 public When To Wear seasons'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
