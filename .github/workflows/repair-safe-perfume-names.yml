name: Repair Safe Perfume Names

on:
  push:
    paths:
      - 'scripts/repair_safe_perfume_names.py'
      - '.github/workflows/repair-safe-perfume-names.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair safe perfume names
        run: python scripts/repair_safe_perfume_names.py
      - name: Commit repaired masters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shobi-master.csv shobi-master-en.csv
          git diff --cached --quiet && exit 0
          git commit -m "Repair validated perfume names"
          git push
