name: Audit Missing Brands

on:
  push:
    paths:
      - 'scripts/audit_missing_brands.py'
      - '.github/workflows/audit-missing-brands.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fill only validated blank brands
        run: python scripts/audit_missing_brands.py --write
      - name: Verify and commit master
        run: |
          python scripts/audit_missing_brands.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shobi-master.csv
          git diff --cached --quiet && exit 0
          git commit -m "Fill validated missing perfume brands"
          git push
